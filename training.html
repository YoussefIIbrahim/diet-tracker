</style></head><body><main class="shell"><header class="training-head"><div><div class="eyebrow">Training</div><h1 id="pageTitle">Today’s session.</h1><p id="pageSub">Choose a workout and start logging.</p></div><time class="today-date" id="dateLabel"></time></header>
<div class="training-layout"><div>
<section class="card plan-hero" id="startPanel"><div class="plan-top"><div><span class="eyebrow" id="planEyebrow">Ready when you are</span><h2 id="suggestedName">Choose a workout</h2><p id="suggestedMeta">Templates load exercises and prescribed sets.</p></div><span class="week-badge" id="weekCount">0 sessions this week</span></div><div class="start-controls"><select id="templateSelect" aria-label="Workout template"></select><button class="btn primary" id="startWorkout">Start workout</button></div><div class="secondary-row"><button class="text-btn" id="newTemplate" type="button">＋ Create template</button><button class="text-btn" id="quickActivity" type="button">Log activity without exercises</button></div></section>
<section class="active-workout" id="activeWorkout"><div class="active-bar"><div><h2 id="activeName">Workout</h2><span id="activeTimer">In progress</span></div><span class="active-progress" id="setProgress">0 / 0 sets</span></div><div class="exercise-list" id="exercises"></div><div class="finish-rail"><span id="draftStatus">Draft saved on this device</span><button class="btn primary" id="finishWorkout">Finish workout</button></div><form class="finish-fields" id="finishForm"><div class="finish-grid"><label class="field"><span>Duration · minutes</span><input id="duration" type="number" min="1" max="600" step="1" inputmode="numeric"></label><label class="field"><span>Session RPE · optional</span><input id="intensity" type="number" min="1" max="10" step=".5" inputmode="decimal"></label><label class="field full"><span>Notes · optional</span><textarea id="notes" placeholder="Performance, energy, pain or substitutions"></textarea></label></div><div class="form-actions"><button class="btn primary" type="submit">Save session</button><button class="btn" id="continueWorkout" type="button">Keep logging</button><button class="btn danger" id="discardWorkout" type="button">Discard draft</button></div></form></section>
</div><aside class="card training-card history-panel"><div class="plan-top"><div><span class="eyebrow">History</span><h2 style="margin-top:5px">Recent sessions</h2></div></div><div class="history-list" id="history"></div></aside></div></main>
<dialog id="templateModal"><form id="templateForm"><h2>Create template</h2><label class="field"><span>Name</span><input id="templateName" maxlength="40" required placeholder="Hotel workout"></label><div id="templateExercises"></div><div class="dialog-actions"><button class="btn" id="addTemplateExercise" type="button">＋ Exercise</button><button class="btn primary" type="submit">Save template</button><button class="btn" id="cancelTemplate" type="button">Cancel</button></div><p id="templateError" style="color:var(--danger)"></p></form></dialog>
<script>
(()=>{'use strict';
const KEY='form.tracker.v2',DRAFT='form.training.draft.v1',$=s=>document.querySelector(s),all=s=>[...document.querySelectorAll(s)],today=()=>{const d=new Date();return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')},uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2),num=v=>v===''?null:Number(v),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state;try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{state={}}state.trainingSessions=Array.isArray(state.trainingSessions)?state.trainingSessions:[];state.customTemplates=state.customTemplates&&typeof state.customTemplates==='object'?state.customTemplates:{};
if(!state.profile){location.replace('index.html');return}
const defaults={"Upper A":[["Barbell or machine bench press",3,"5–8"],["Chest-supported row",3,"6–10"],["Incline dumbbell press",3,"8–12"],["Neutral-grip lat pulldown",3,"8–12"],["Cable lateral raise",3,"12–20"],["Cable triceps pressdown",2,"10–15"],["Dumbbell or cable curl",2,"10–15"]],"Upper B":[["Pull-up or lat pulldown",3,"6–10"],["Machine or dumbbell chest press",3,"8–12"],["One-arm cable or machine row",3,"8–12"],["Pec deck or cable fly",2,"10–15"],["Cable lateral raise",3,"12–20"],["Reverse pec deck",2,"12–20"],["Overhead cable triceps extension",2,"10–15"],["Preacher or cable curl",2,"10–15"]],"Lower A":[["Leg press",3,"8–12"],["Romanian deadlift",3,"6–10"],["Seated leg curl",3,"10–15"],["Leg extension",2,"12–15"],["Standing calf raise",3,"8–15"],["Cable crunch",3,"10–15"]],"Lower B":[["Hack squat or leg press",3,"8–12"],["Hip thrust or glute machine",3,"8–12"],["Bulgarian split squat",2,"8–12 / leg"],["Leg extension",2,"12–15"],["Seated leg curl",3,"10–15"],["Seated calf raise",3,"10–15"],["Hanging knee raise or cable crunch",3,"10–15"]]};
const templates={};const imported=state.profile.trainingPlan?.templates||[];if(imported.length)imported.forEach(t=>templates[t.name]=(t.exercises||[]).map(x=>({name:x.name,sets:Number(x.sets)||1,target:x.reps||x.target||'',rir:x.rir||'',metric:x.metric,unit:x.unit})));else Object.entries(defaults).forEach(([name,rows])=>templates[name]=rows.map(x=>({name:x[0],sets:x[1],target:x[2]})));Object.entries(state.customTemplates).forEach(([name,rows])=>templates[name]=rows.map(x=>({...x})));
let draft=null;try{draft=JSON.parse(localStorage.getItem(DRAFT)||'null')}catch{}
function saveState(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{alert('Could not save. Check browser storage settings.');return false}}
function saveDraft(){if(!draft)return;draft.updatedAt=new Date().toISOString();try{localStorage.setItem(DRAFT,JSON.stringify(draft));$('#draftStatus').textContent='Draft saved'}catch{$('#draftStatus').textContent='Draft could not be saved'}}
function kind(ex){const text=(ex.name+' '+(ex.target||'')).toLowerCase();if(ex.metric)return{metric:ex.metric,unit:ex.unit||ex.metric};if(/breath/.test(text))return{metric:'breaths',unit:'breaths'};if(/walk|bike|cardio|elliptical|minute|\bmin\b/.test(text))return{metric:'duration',unit:'minutes'};if(/stretch|mobility|second|\bsec\b|hold/.test(text))return{metric:'duration',unit:'seconds'};if(/cycle/.test(text))return{metric:'cycles',unit:'cycles'};return{metric:'strength',unit:''}}
function makeDraft(name,activities=false){return{id:uid(),date:today(),name,workoutKey:name,startedAt:new Date().toISOString(),notes:'',duration:null,intensity:null,activities,exercises:activities?[]:(templates[name]||[]).map(ex=>{const type=kind(ex);return{name:ex.name,target:ex.target||'',rirTarget:ex.rir||'',metric:type.metric,unit:type.unit,status:'active',sets:Array.from({length:Number(ex.sets)||1},()=>({id:uid(),weight:null,reps:null,rir:null,value:null,done:false}))}})}}
function scheduled(){const day=new Date().toLocaleDateString('en-US',{weekday:'long'}).toLowerCase(),x=(state.profile.trainingPlan?.weeklySchedule||[]).find(x=>String(x.day||x.weekday||'').toLowerCase()===day);return x?.workout||x?.template||x?.name||''}
function fillOptions(){const select=$('#templateSelect'),names=Object.keys(templates);select.innerHTML=names.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join('')+'<option value="Football">Football</option>';const plan=scheduled();if(plan&&[...select.options].some(o=>o.value===plan))select.value=plan;$('#suggestedName').textContent=plan||select.value||'Choose a workout';$('#suggestedMeta').textContent=plan?'Scheduled for today':'Choose any template or quick activity.'}
function renderSet(set,ex,index){if(ex.metric==='strength')return '<div class="work-set" data-set="'+set.id+'"><span>'+index+'</span><input class="weight" type="number" min="0" step=".5" inputmode="decimal" placeholder="kg" value="'+(set.weight??'')+'" aria-label="Set '+index+' load"><input class="reps" type="number" min="0" step="1" inputmode="numeric" placeholder="reps" value="'+(set.reps??'')+'" aria-label="Set '+index+' reps"><input class="rir" type="number" min="0" max="10" step="1" inputmode="numeric" placeholder="RIR" value="'+(set.rir??'')+'" aria-label="Set '+index+' RIR"><input class="done-check" type="checkbox" '+(set.done?'checked':'')+' aria-label="Complete set '+index+'"></div>';return '<div class="typed-set" data-set="'+set.id+'"><span>'+index+'</span><input class="value" type="number" min="0" step="1" inputmode="numeric" placeholder="Amount" value="'+(set.value??'')+'" aria-label="Set '+index+' '+esc(ex.unit)+'"><span class="unit-box">'+esc(ex.unit)+'</span><input class="done-check" type="checkbox" '+(set.done?'checked':'')+' aria-label="Complete set '+index+'"></div>'}
function renderActive(){if(!draft){$('#startPanel').classList.remove('hidden');$('#activeWorkout').classList.remove('visible');return}$('#startPanel').classList.add('hidden');$('#activeWorkout').classList.add('visible');$('#activeName').textContent=draft.name;const total=draft.exercises.reduce((n,e)=>n+e.sets.length,0),done=draft.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0);$('#setProgress').textContent=done+' / '+total+' sets';$('#activeTimer').textContent='Started '+new Date(draft.startedAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});$('#exercises').innerHTML=draft.activities?'<div class="card training-card"><p class="sub">Log duration and effort when you finish.</p></div>':draft.exercises.map((ex,i)=>'<details class="work-exercise" data-ex="'+i+'" '+(i===0?'open':'')+'><summary><div class="exercise-copy"><b>'+esc(ex.name)+'</b><span>'+esc(ex.target||ex.unit)+(ex.rirTarget?' · '+esc(ex.rirTarget):'')+'</span></div><span class="exercise-count '+(ex.sets.every(s=>s.done)?'done':'')+'">'+ex.sets.filter(s=>s.done).length+'/'+ex.sets.length+'</span></summary><div class="set-area">'+(ex.metric==='strength'?'<div class="set-head"><span>Set</span><span>Load</span><span>Reps</span><span>RIR</span><span>Done</span></div>':'')+ex.sets.map((s,j)=>renderSet(s,ex,j+1)).join('')+'<button class="add-set" type="button" data-add-set="'+i+'">＋ Add set</button></div></details>').join('');
 bindActive()}
function bindActive(){all('[data-set]').forEach(row=>row.oninput=()=>{const exIndex=Number(row.closest('[data-ex]')?.dataset.ex),set=draft.exercises[exIndex]?.sets.find(s=>s.id===row.dataset.set);if(!set)return;if(row.querySelector('.weight')){set.weight=num(row.querySelector('.weight').value);set.reps=num(row.querySelector('.reps').value);set.rir=num(row.querySelector('.rir').value)}else set.value=num(row.querySelector('.value').value);set.done=row.querySelector('.done-check').checked;saveDraft();renderProgress()});all('[data-add-set]').forEach(b=>b.onclick=()=>{draft.exercises[Number(b.dataset.addSet)].sets.push({id:uid(),weight:null,reps:null,rir:null,value:null,done:false});saveDraft();renderActive()})}
function renderProgress(){const total=draft?.exercises.reduce((n,e)=>n+e.sets.length,0)||0,done=draft?.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0)||0;$('#setProgress').textContent=done+' / '+total+' sets'}
function start(name,activities=false){if(draft&&!confirm('Replace the saved workout draft?'))return;draft=makeDraft(name,activities);saveDraft();renderActive()}
function renderHistory(){const sessions=[...state.trainingSessions].sort((a,b)=>(b.date+(b.completedAt||'')).localeCompare(a.date+(a.completedAt||''))).slice(0,12);$('#history').innerHTML=sessions.length?sessions.map(s=>{const done=(s.exercises||[]).reduce((n,e)=>n+(e.sets||[]).filter(x=>x.done!==false).length,0);return '<article class="session-card"><div class="session-top"><b>'+esc(s.name||'Training')+'</b><time>'+esc(s.date)+'</time></div><div class="session-meta">'+done+' sets'+(s.duration?' · '+s.duration+' min':'')+(s.intensity?' · RPE '+s.intensity:'')+'</div><div class="session-actions"><button class="mini duplicate" data-id="'+esc(s.id)+'">Repeat</button><button class="mini danger delete" data-id="'+esc(s.id)+'">Delete</button></div></article>'}).join(''):'<div class="empty">Your completed sessions will appear here.</div>';all('.duplicate').forEach(b=>b.onclick=()=>{const s=state.trainingSessions.find(x=>String(x.id)===b.dataset.id);if(s)start(s.workoutKey||s.name)});all('.delete').forEach(b=>b.onclick=()=>{if(confirm('Delete this session?')){state.trainingSessions=state.trainingSessions.filter(x=>String(x.id)!==b.dataset.id);saveState();renderHistory();renderHeader()}})}
function renderHeader(){const now=new Date();$('#dateLabel').textContent=now.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});const cut=new Date();cut.setDate(cut.getDate()-6);const start=todayFrom(cut),count=state.trainingSessions.filter(x=>x.date>=start&&x.date<=today()).length;$('#weekCount').textContent=count+' session'+(count===1?'':'s')+' this week'}
function todayFrom(d){return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
$('#startWorkout').onclick=()=>start($('#templateSelect').value,$('#templateSelect').value==='Football');$('#quickActivity').onclick=()=>start('Activity',true);$('#templateSelect').onchange=e=>{$('#suggestedName').textContent=e.target.value};
$('#finishWorkout').onclick=()=>{const elapsed=Math.max(1,Math.round((Date.now()-new Date(draft.startedAt))/60000));$('#duration').value=draft.duration||elapsed;$('#intensity').value=draft.intensity||'';$('#notes').value=draft.notes||'';$('#finishForm').classList.add('visible');$('#finishForm').scrollIntoView({behavior:'smooth',block:'center'})};$('#continueWorkout').onclick=()=>$('#finishForm').classList.remove('visible');
$('#finishForm').onsubmit=e=>{e.preventDefault();const duration=num($('#duration').value),intensity=num($('#intensity').value);if(duration==null||duration<1||intensity!=null&&(intensity<1||intensity>10)){alert('Enter a valid duration. Session RPE can be left blank.');return}draft.duration=duration;draft.intensity=intensity;draft.notes=$('#notes').value.trim();draft.completedAt=new Date().toISOString();state.trainingSessions.push(draft);if(saveState()){localStorage.removeItem(DRAFT);draft=null;$('#finishForm').classList.remove('visible');renderActive();renderHistory();renderHeader();toast('Workout saved')}};
$('#discardWorkout').onclick=()=>{if(confirm('Discard this workout draft?')){draft=null;localStorage.removeItem(DRAFT);$('#finishForm').classList.remove('visible');renderActive()}};
function addTemplateRow(){const row=document.createElement('div');row.className='template-row';row.innerHTML='<input class="tpl-name" placeholder="Exercise" required><input class="tpl-sets" type="number" min="1" max="10" value="3" required><input class="tpl-target" placeholder="8–12"><button class="mini danger" type="button">×</button>';row.querySelector('button').onclick=()=>row.remove();$('#templateExercises').append(row)}
$('#newTemplate').onclick=()=>{$('#templateForm').reset();$('#templateExercises').innerHTML='';$('#templateError').textContent='';addTemplateRow();$('#templateModal').showModal()};$('#addTemplateExercise').onclick=addTemplateRow;$('#cancelTemplate').onclick=()=>$('#templateModal').close();$('#templateForm').onsubmit=e=>{e.preventDefault();const name=$('#templateName').value.trim(),rows=all('.template-row').map(r=>({name:r.querySelector('.tpl-name').value.trim(),sets:Number(r.querySelector('.tpl-sets').value),target:r.querySelector('.tpl-target').value.trim()}));if(!name||!rows.length||rows.some(x=>!x.name||!Number.isInteger(x.sets)||x.sets<1)){return $('#templateError').textContent='Complete the template name and exercises.'}if(Object.keys(templates).some(x=>x.toLowerCase()===name.toLowerCase()))return $('#templateError').textContent='That template name already exists.';state.customTemplates[name]=rows;templates[name]=rows;if(saveState()){$('#templateModal').close();fillOptions();$('#templateSelect').value=name}};
function toast(msg){const n=document.createElement('div');n.className='toast';n.textContent=msg;document.body.append(n);setTimeout(()=>n.remove(),1800)}
fillOptions();renderHeader();renderActive();renderHistory();
})();
</script><script src="app-shell.js?v=3"></script></body></html>
