<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b0f"><meta name="apple-mobile-web-app-capable" content="yes"><title>Form · Training</title><style>
:root{color-scheme:dark;--bg:#090b0f;--panel:#10141a;--panel2:#151a22;--line:#252c37;--text:#f3f5f7;--muted:#8c96a6;--lime:#b7f34a;--violet:#a98cff;--red:#ff6b76;--input:#0c0f14;--r:18px}*{box-sizing:border-box}html{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}body{margin:0;background:radial-gradient(circle at 90% -10%,#281e37 0,transparent 32%),var(--bg);min-height:100vh}a{color:inherit;text-decoration:none}button,input,textarea{font:inherit}.shell{width:min(1100px,100%);margin:auto;padding:24px 18px 100px}.top{display:flex;justify-content:space-between}.brand{font-size:1.2rem;font-weight:800;letter-spacing:-.04em}.brand i{color:var(--lime);font-style:normal}.status{font-size:.78rem;color:var(--muted)}header{margin:40px 0 24px}.eyebrow{color:var(--violet);font-size:.7rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase}h1{font-size:clamp(2.3rem,8vw,4rem);letter-spacing:-.06em;line-height:1;margin:9px 0}header p{color:var(--muted);margin:0}.layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,.6fr);gap:16px}.panel{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:20px}.panel h2{font-size:1rem;margin:0 0 18px}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{color:var(--muted);font-size:.75rem;font-weight:650}.field input,.field textarea{width:100%;background:var(--input);border:1px solid var(--line);color:var(--text);border-radius:11px;padding:11px;outline:none}.field input:focus,.field textarea:focus{border-color:var(--violet);box-shadow:0 0 0 3px #a98cff20}.field textarea{min-height:80px}.exercise{border:1px solid var(--line);border-radius:14px;background:#0c1015;padding:14px;margin-top:12px}.exercise-head{display:flex;gap:8px}.exercise-head input{flex:1;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--text);font-weight:750;padding:8px;outline:none}.icon-btn{border:0;background:#1a2029;color:var(--muted);border-radius:9px;padding:8px 10px;cursor:pointer}.icon-btn.danger{color:var(--red)}.sets{margin-top:12px}.set{display:grid;grid-template-columns:30px repeat(3,1fr) 34px;gap:7px;align-items:end;margin-top:8px}.set-num{font-size:.72rem;color:var(--muted);padding-bottom:11px}.set label{font-size:.62rem;color:var(--muted);display:grid;gap:4px}.set input{width:100%;min-width:0;background:var(--input);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px}.add-set{margin-top:10px;color:var(--violet);background:transparent;border:0;font-weight:750;padding:5px;cursor:pointer}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:11px 15px;border-radius:12px;font-weight:750;cursor:pointer}.btn.primary{background:var(--violet);border-color:var(--violet);color:#110d17}.session{border:1px solid var(--line);border-radius:14px;padding:14px;background:#0c1015;margin-bottom:9px}.session-top{display:flex;justify-content:space-between;gap:10px}.session small{color:var(--muted)}.session-meta{color:var(--muted);font-size:.76rem;margin-top:7px}.session-actions{display:flex;gap:6px;margin-top:12px}.mini{border:0;background:#1a2029;color:var(--muted);border-radius:8px;padding:7px 10px}.mini.danger{color:var(--red)}.empty{color:var(--muted);font-size:.85rem}.nav{position:fixed;z-index:20;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:5px;background:rgba(16,20,26,.88);border:1px solid var(--line);backdrop-filter:blur(18px);padding:6px;border-radius:16px}.nav a{padding:10px 15px;border-radius:11px;color:var(--muted);font-size:.78rem;font-weight:750}.nav a.active{background:var(--text);color:var(--bg)}@media(max-width:780px){.layout{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.nav{width:calc(100% - 24px);justify-content:space-around}.nav a{padding:10px}}@media(max-width:480px){.set{grid-template-columns:25px repeat(3,1fr) 30px}.panel{padding:16px}}
</style></head><body><main class="shell"><div class="top"><a class="brand" href="index.html">f<i>o</i>rm.</a><div class="status" id="status">Stored on this device</div></div><header><div class="eyebrow">Session log</div><h1>Training.</h1><p>Workouts, working sets and honest intensity.</p></header><div class="layout"><section class="panel"><h2 id="formTitle">New session</h2><form id="form"><input type="hidden" id="sessionId"><div class="fields"><div class="field"><label for="date">Date</label><input id="date" type="date" required></div><div class="field"><label for="name">Workout</label><input id="name" placeholder="Upper A, Lower B, Football…" required></div><div class="field"><label for="duration">Duration · minutes</label><input id="duration" type="number" min="0" step="1" inputmode="numeric"></div><div class="field"><label for="intensity">Session intensity · RPE 1–10</label><input id="intensity" type="number" min="1" max="10" step=".5" inputmode="decimal"></div><div class="field full"><label for="notes">Session notes</label><textarea id="notes" placeholder="Energy, pain, performance, what to change next time…"></textarea></div></div><div id="exercises"></div><div class="actions"><button class="btn" type="button" id="addExercise">+ Add exercise</button><button class="btn primary" type="submit">Save session</button><button class="btn" type="button" id="clear">Clear</button></div></form></section><aside class="panel"><h2>Recent sessions</h2><div id="history"></div></aside></div></main><nav class="nav"><a href="index.html">Home</a><a href="nutrition.html">Nutrition</a><a class="active" href="training.html">Training</a></nav><template id="exerciseTpl"><article class="exercise"><div class="exercise-head"><input class="exercise-name" placeholder="Exercise name"><button class="icon-btn danger remove-exercise" type="button">×</button></div><div class="sets"></div><button class="add-set" type="button">+ Add set</button></article></template><template id="setTpl"><div class="set"><span class="set-num"></span><label>kg<input class="set-weight" type="number" min="0" step=".5" inputmode="decimal"></label><label>reps<input class="set-reps" type="number" min="0" step="1" inputmode="numeric"></label><label>RIR<input class="set-rir" type="number" min="0" max="10" step="1" inputmode="numeric"></label><button class="icon-btn danger remove-set" type="button">×</button></div></template><script>
(()=>{'use strict';const KEY='form.tracker.v2',base={version:2,settings:{baselineWeight:null,baselineWaist:null,proteinGoal:170,carbsGuide:250,fatsGuide:70},nutritionEntries:[],trainingSessions:[]},$=s=>document.querySelector(s),clone=x=>JSON.parse(JSON.stringify(x)),num=v=>v===''?null:Number(v),today=()=>{const d=new Date();return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};function load(){try{return Object.assign(clone(base),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return clone(base)}}let state=load();function save(){localStorage.setItem(KEY,JSON.stringify(state));$('#status').textContent='Saved just now';setTimeout(()=>$('#status').textContent='Stored on this device',1500)}function renumber(ex){ex.querySelectorAll('.set-num').forEach((n,i)=>n.textContent=i+1)}function addSet(ex,data={}){const n=$('#setTpl').content.firstElementChild.cloneNode(true);n.querySelector('.set-weight').value=data.weight??'';n.querySelector('.set-reps').value=data.reps??'';n.querySelector('.set-rir').value=data.rir??'';n.querySelector('.remove-set').onclick=()=>{n.remove();renumber(ex)};ex.querySelector('.sets').appendChild(n);renumber(ex)}function addExercise(data={}){const ex=$('#exerciseTpl').content.firstElementChild.cloneNode(true);ex.querySelector('.exercise-name').value=data.name||'';ex.querySelector('.remove-exercise').onclick=()=>ex.remove();ex.querySelector('.add-set').onclick=()=>addSet(ex);(data.sets?.length?data.sets:[{}]).forEach(s=>addSet(ex,s));$('#exercises').appendChild(ex)}function clearForm(){form.reset();$('#sessionId').value='';$('#date').value=today();$('#exercises').innerHTML='';addExercise();$('#formTitle').textContent='New session'}function sessionFromForm(){return{id:$('#sessionId').value||String(Date.now()),date:$('#date').value,name:$('#name').value.trim(),duration:num($('#duration').value),intensity:num($('#intensity').value),notes:$('#notes').value.trim(),exercises:[...document.querySelectorAll('.exercise')].map(ex=>({name:ex.querySelector('.exercise-name').value.trim(),sets:[...ex.querySelectorAll('.set')].map(s=>({weight:num(s.querySelector('.set-weight').value),reps:num(s.querySelector('.set-reps').value),rir:num(s.querySelector('.set-rir').value)}))})).filter(e=>e.name||e.sets.some(s=>s.weight!=null||s.reps!=null))}}function edit(id){const s=state.trainingSessions.find(x=>x.id===id);if(!s)return;clearForm();$('#sessionId').value=s.id;$('#date').value=s.date;$('#name').value=s.name||'';$('#duration').value=s.duration??'';$('#intensity').value=s.intensity??'';$('#notes').value=s.notes||'';$('#exercises').innerHTML='';(s.exercises?.length?s.exercises:[{}]).forEach(addExercise);$('#formTitle').textContent='Edit session';scrollTo({top:0,behavior:'smooth'})}function render(){const a=[...state.trainingSessions].sort((x,y)=>y.date.localeCompare(x.date)).slice(0,10);$('#history').innerHTML=a.length?a.map(s=>{const sets=(s.exercises||[]).reduce((n,e)=>n+(e.sets?.length||0),0);return`<article class="session"><div class="session-top"><b>${s.name||'Training'}</b><small>${s.date}</small></div><div class="session-meta">${s.exercises?.length||0} exercises · ${sets} sets${s.intensity?' · RPE '+s.intensity:''}${s.duration?' · '+s.duration+' min':''}</div><div class="session-actions"><button class="mini edit" data-id="${s.id}">Open</button><button class="mini danger del" data-id="${s.id}">Delete</button></div></article>`}).join(''):'<div class="empty">No training sessions yet.</div>';document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>edit(b.dataset.id));document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{if(confirm('Delete this training session?')){state.trainingSessions=state.trainingSessions.filter(s=>s.id!==b.dataset.id);save();render();clearForm()}})}const form=$('#form');$('#addExercise').onclick=()=>addExercise();$('#clear').onclick=clearForm;form.onsubmit=e=>{e.preventDefault();const s=sessionFromForm();state.trainingSessions=state.trainingSessions.filter(x=>x.id!==s.id);state.trainingSessions.push(s);save();render();clearForm()};clearForm();render();})();
</script></body></html>
